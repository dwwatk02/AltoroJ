trigger:
- none

pool:
  vmImage: ubuntu-latest

steps:

- task: Bash@3
  displayName: 'AS360 Scan'
  inputs:
    targetType: 'filePath'
    filePath: "$(System.DefaultWorkingDirectory)/run_sast.sh"



